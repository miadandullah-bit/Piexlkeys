name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Rename APK for Release
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Pixelkeys-${VERSION_TAG}.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixelkeys-apk
          path: app/build/outputs/apk/debug/Pixelkeys-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/Pixelkeys-*.apk
          generate_release_notes: true
